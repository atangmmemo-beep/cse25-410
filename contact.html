<!DOCTYPE html>
<html>
<head>
<title>Contact</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand" href="index.html">Spotless Ride</a>
</div>
</nav>

<div class="container section">
<h1>Contact Us</h1>

<form onsubmit="sendMessage(event)">
<input class="form-control mb-3" placeholder="Name" required>
<input class="form-control mb-3" placeholder="Email" required>
<textarea class="form-control mb-3" placeholder="Message"></textarea>

<button class="btn btn-primary">Submit</button>
</form>

<p class="mt-3">📍 Gaborone, Botswana</p>
</div>

<script>
function sendMessage(e){
e.preventDefault();
alert("Message sent successfully!");
}
</script>

<footer class="footer text-center">
<p>Spotless Ride - Gaborone</p>
</footer>

</body>
</html>
