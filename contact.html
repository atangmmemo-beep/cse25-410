<!DOCTYPE html>
<html>
<head>
<title>Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container my-5">
<h1>Contact Us</h1>

<form onsubmit="submitForm(event)">
<input class="form-control mb-2" type="text" placeholder="Name" required>
<input class="form-control mb-2" type="email" placeholder="Email" required>
<textarea class="form-control mb-2" placeholder="Message"></textarea>
<button class="btn btn-primary">Submit</button>
</form>

<p class="mt-3">📍 Gaborone, Botswana</p>

</div>

<script>
function submitForm(e){
e.preventDefault();
alert("Message sent!");
}
</script>

</body>
</html>
